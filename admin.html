<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Quản trị | Thiên Phúc Vĩnh Hằng Viên</title>
  <link rel="stylesheet" href="admin-ui.css">
  <style>
    *{box-sizing:border-box}body{margin:0;color:var(--ink)}button,input,textarea,select{font:inherit}button{cursor:pointer}.login{min-height:100vh;display:grid;place-items:center}.login-card{background:#fff}.field{display:block;margin:14px 0;font-size:12px;font-weight:700}.field input,.field textarea,.field select,.control{display:block;width:100%;margin-top:7px;padding:12px;border:1px solid var(--line);background:#fff}.btn{border:0;padding:11px 15px;font-weight:700;border-radius:9px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.primary{background:var(--g);color:#fff}.gold{background:var(--gold);color:#fff}.light{background:#eef2ed;color:var(--g)}.danger{background:#fff0ef;color:#9a302b}.wide{width:100%;margin-top:14px}.msg{font-size:12px;margin-top:10px;color:var(--red)}.app{display:none;min-height:100vh}.shell{display:grid;min-height:100vh}.side{color:#fff;position:sticky;top:0;height:100vh}.navbtn{width:100%;text-align:left;background:transparent;border:0;color:#dfe7e2}.sidefoot{position:absolute;left:18px;right:18px}.main{min-width:0}.top{display:flex;align-items:center;position:sticky;top:0;z-index:5}.content{margin:auto}.head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px}.head h1{margin:0}.head p{color:var(--muted);margin:6px 0 0;line-height:1.6}.admin-kicker{display:block;color:var(--gold);font-size:10px;letter-spacing:1.7px;font-weight:700;margin-bottom:8px}.panel{background:#fff;border:1px solid var(--line);padding:20px;margin-bottom:20px}.panel h2{margin:0 0 16px;font:700 20px 'Playfair Display',Georgia,serif;color:var(--g)}.stats{display:grid;grid-template-columns:repeat(4,1fr)}.stat b{display:block}.grid{display:grid;grid-template-columns:repeat(3,1fr)}.card{background:#fff;border:1px solid var(--line);overflow:hidden}.preview{overflow:hidden;background:#e9eee9;position:relative}.preview img{width:100%;height:100%;object-fit:cover}.preview-tag{position:absolute;left:10px;bottom:10px;background:rgba(7,39,27,.82);color:#fff;padding:5px 8px;border-radius:6px;font-size:9px}.body{padding:15px}.path{font-size:10px;color:#8a918c;word-break:break-all}.file{display:block;margin:10px 0;font-size:11px}.status{font-size:11px;min-height:14px;margin-top:8px;color:#52715f}.row{display:flex;gap:10px;align-items:center}.grow{flex:1}.album{display:grid;grid-template-columns:repeat(4,1fr)}.media{background:#fff;border:1px solid var(--line);overflow:hidden}.media img{width:100%;object-fit:cover}.media .meta{padding:11px}.media b{display:block;font-size:12px}.media small{color:var(--muted);font-size:10px;word-break:break-all;display:block;margin-top:4px}.media-actions,.item-actions,.editor-actions,.editor-head{display:flex;gap:8px;align-items:center}.media-actions{margin-top:10px;flex-wrap:wrap}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}.list{display:grid;gap:10px}.item{background:#fff;border:1px solid var(--line);display:flex;gap:14px;align-items:center}.item img{object-fit:cover}.itemmain{flex:1;min-width:0}.item p{margin:0;color:var(--muted);font-size:12px}.item-actions{flex-wrap:wrap;justify-content:flex-end}.badge,.date-chip{display:inline-block;font-size:10px;font-weight:700}.date-chip{color:var(--muted);margin-left:8px}.checkrow{display:flex;flex-wrap:wrap;gap:12px}.checkrow label{font-size:12px}.hide{display:none!important}.spinner{opacity:.55;pointer-events:none}.loading{text-align:center;padding:40px}.dashboard-grid{display:grid;grid-template-columns:1.4fr .8fr;gap:18px}.admin-shortcuts{grid-template-columns:1fr!important}.admin-shortcut{width:100%;font-family:inherit;cursor:pointer;text-align:left}.health{display:grid;gap:14px}.health>div{display:grid;grid-template-columns:14px 1fr;gap:2px 8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.health>div:last-child{border-bottom:0}.health small{grid-column:2;color:var(--muted);font-size:10px}.dot{width:9px;height:9px;border-radius:50%;display:block}.dot.ok{background:#4f966f;box-shadow:0 0 0 4px rgba(79,150,111,.1)}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:15px;margin:20px 0 14px}.toolbar .control{width:min(330px,100%);margin:0}.editor-head{justify-content:space-between;margin-bottom:8px}.avatar{width:42px;height:42px;border-radius:12px;background:#edf3ef;color:var(--g);display:grid;place-items:center;font-weight:700}.perm-list{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}.perm-list span{font-size:9px;background:#f1f4f1;padding:4px 7px;border-radius:6px;color:#587064}.upload-box{cursor:pointer}.notice{font-size:12px}.top .admin-brand-sub{margin-left:10px}
    @media(max-width:1050px){.stats{grid-template-columns:repeat(2,1fr)}.dashboard-grid{grid-template-columns:1fr}}
    @media(max-width:760px){.sidefoot{position:static}.full{grid-column:auto}.head{align-items:flex-start;flex-direction:column}.toolbar{align-items:stretch;flex-direction:column}.toolbar .control{width:100%}.item-actions{width:100%;justify-content:flex-start}.editor-actions{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body>
  <section id="login" class="login">
    <form id="loginForm" class="login-card">
      <h1>Thiên Phúc Admin</h1>
      <p>Quản lý hình ảnh, bài viết, nhân viên và nội dung website trong một trung tâm duy nhất.</p>
      <label class="field">Tài khoản<input id="username" autocomplete="username" required></label>
      <label class="field">Mật khẩu<input id="password" type="password" autocomplete="current-password" required></label>
      <button class="btn primary wide">Đăng nhập quản trị</button>
      <div id="loginMsg" class="msg"></div>
    </form>
  </section>
  <section id="app" class="app">
    <div class="shell">
      <aside class="side">
        <h2>Thiên Phúc</h2>
        <small>Website Management</small>
        <button class="navbtn active" data-tab="dashboard">Tổng quan</button>
        <button class="navbtn" data-tab="appearance" data-perm="appearance">Giao diện & hình ảnh</button>
        <button class="navbtn" data-tab="media" data-perm="media">Thư viện ảnh</button>
        <button class="navbtn" data-tab="news" data-perm="news">Bài viết & đánh giá SEO</button>
        <button class="navbtn" data-tab="staff" data-perm="staff">Nhân viên & phân quyền</button>
        <div class="sidefoot">
          <div id="who" class="who"></div>
          <button id="logout" class="btn light wide">Đăng xuất</button>
        </div>
      </aside>
      <main class="main">
        <header class="top"><strong>Thiên Phúc Vĩnh Hằng Viên</strong><span class="admin-brand-sub">Trung tâm quản trị</span></header>
        <div id="content" class="content"></div>
      </main>
    </div>
  </section>
  <script src="admin.js"></script>
</body>
</html>
