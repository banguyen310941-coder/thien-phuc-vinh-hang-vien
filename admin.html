<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quản trị | Thiên Phúc Vĩnh Hằng Viên</title><style>:root{--g:#0a3524;--g2:#15523a;--gold:#b98b45;--cream:#f6f3ec;--ink:#26332d;--muted:#727a75;--line:#e4ded3;--bg:#f3f5f2;--red:#a33}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input,textarea,select{font:inherit}button{cursor:pointer}.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#07291b,#174f38)}.login-card{width:min(430px,calc(100% - 32px));background:#fff;padding:38px;border-radius:18px;box-shadow:0 30px 80px #0004}.login-card h1{font:700 30px Georgia,serif;color:var(--g);margin:0 0 8px}.login-card p{color:var(--muted);line-height:1.6}.field{display:block;margin:14px 0;font-size:12px;font-weight:700}.field input,.field textarea,.field select,.control{display:block;width:100%;margin-top:7px;padding:12px;border:1px solid var(--line);border-radius:9px;background:#fff}.btn{border:0;border-radius:9px;padding:11px 15px;font-weight:700}.primary{background:var(--g);color:#fff}.gold{background:var(--gold);color:#fff}.light{background:#eef2ed;color:var(--g)}.danger{background:#fff0ef;color:#9a302b}.wide{width:100%;margin-top:14px}.msg{font-size:12px;margin-top:10px;color:var(--red)}.app{display:none;min-height:100vh}.shell{display:grid;grid-template-columns:245px 1fr;min-height:100vh}.side{background:#082d1f;color:#fff;padding:22px 16px;position:sticky;top:0;height:100vh}.side h2{font:700 20px Georgia,serif;margin:4px 8px}.side small{display:block;color:#b8c5bd;margin:0 8px 24px}.navbtn{width:100%;text-align:left;background:transparent;border:0;color:#dfe7e2;padding:12px 13px;border-radius:9px;margin:3px 0;font-weight:700;font-size:13px}.navbtn.active,.navbtn:hover{background:#ffffff14;color:#f1d49d}.sidefoot{position:absolute;bottom:20px;left:16px;right:16px;border-top:1px solid #ffffff18;padding-top:14px}.sidefoot .who{font-size:12px;color:#dfe7e2;margin-bottom:10px}.main{min-width:0}.top{height:66px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 28px;position:sticky;top:0;z-index:5}.top strong{font-family:Georgia,serif;color:var(--g)}.logout{margin-left:auto}.content{padding:28px;width:min(1320px,100%);margin:auto}.head{display:flex;align-items:flex-end;gap:20px;margin-bottom:24px}.head h1{font:700 34px Georgia,serif;color:var(--g);margin:0}.head p{color:var(--muted);margin:6px 0 0;line-height:1.6}.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:20px;box-shadow:0 8px 25px #1635230a}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stat b{display:block;font:700 28px Georgia,serif;color:var(--g)}.stat span{font-size:12px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:#fff;border:1px solid var(--line);border-radius:13px;overflow:hidden}.preview{height:180px;background:#e9eee9;overflow:hidden}.preview img{width:100%;height:100%;object-fit:cover}.body{padding:15px}.body h3{font:700 18px Georgia,serif;color:var(--g);margin:0 0 7px}.path{font-size:10px;color:#8a918c;word-break:break-all;min-height:25px}.file{display:block;border:1px dashed #cfc7b6;padding:10px;border-radius:9px;margin:10px 0;background:#faf9f5;font-size:11px}.status{font-size:11px;min-height:14px;margin-top:8px;color:#52715f}.row{display:flex;gap:10px;align-items:center}.row>*{min-width:0}.grow{flex:1}.album{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.media{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}.media img{width:100%;height:150px;object-fit:cover;background:#e7ece8}.media .meta{padding:11px}.media b{display:block;font-size:12px;color:var(--g);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.media small{color:var(--muted);font-size:10px;word-break:break-all}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}.list{display:grid;gap:10px}.item{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;gap:14px;align-items:center}.item img{width:100px;height:70px;object-fit:cover;border-radius:8px;background:#eef1ee}.itemmain{flex:1;min-width:0}.item h3{margin:0 0 6px;font:700 17px Georgia,serif;color:var(--g)}.item p{margin:0;color:var(--muted);font-size:12px;line-height:1.5}.badge{display:inline-block;padding:4px 8px;border-radius:20px;background:#eef4ef;color:#326148;font-size:10px;font-weight:700}.checkrow{display:flex;flex-wrap:wrap;gap:12px;margin-top:8px}.checkrow label{font-size:12px;background:#f6f7f4;padding:8px 10px;border-radius:8px}.hide{display:none!important}.notice{background:#fff8e8;border:1px solid #ead8ae;padding:12px 14px;border-radius:10px;color:#6d5d3e;font-size:12px;line-height:1.6}.spinner{opacity:.55;pointer-events:none}@media(max-width:1050px){.grid{grid-template-columns:repeat(2,1fr)}.album{grid-template-columns:repeat(3,1fr)}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:760px){.shell{grid-template-columns:1fr}.side{position:relative;height:auto}.sidefoot{position:static;margin-top:15px}.content{padding:18px}.grid,.album,.formgrid,.stats{grid-template-columns:1fr}.full{grid-column:auto}.top{padding:0 18px}.item{align-items:flex-start}.item img{width:80px;height:60px}}</style></head><body><section id="login" class="login"><form id="loginForm" class="login-card"><h1>Thiên Phúc Admin</h1><p>Trung tâm quản trị website: giao diện, album ảnh, tin tức, nhân viên và phân quyền.</p><label class="field">Tài khoản<input id="username" autocomplete="username" required></label><label class="field">Mật khẩu<input id="password" type="password" autocomplete="current-password" required></label><button class="btn primary wide">Đăng nhập</button><div id="loginMsg" class="msg"></div></form></section><section id="app" class="app"><div class="shell"><aside class="side"><h2>Thiên Phúc</h2><small>Website Management</small><button class="navbtn active" data-tab="dashboard">Tổng quan</button><button class="navbtn" data-tab="appearance" data-perm="appearance">Giao diện & tất cả ảnh</button><button class="navbtn" data-tab="media" data-perm="media">Album ảnh</button><button class="navbtn" data-tab="news" data-perm="news">Bài viết tin tức</button><button class="navbtn" data-tab="staff" data-perm="staff">Nhân viên & phân quyền</button><div class="sidefoot"><div id="who" class="who"></div><button id="logout" class="btn light wide">Đăng xuất</button></div></aside><main class="main"><header class="top"><strong>Thiên Phúc Vĩnh Hằng Viên</strong><span style="margin-left:10px;color:#8a928d;font-size:11px">Trung tâm quản trị</span></header><div id="content" class="content"></div></main></div></section><script>const login=document.querySelector('#login'),app=document.querySelector('#app'),content=document.querySelector('#content');let session=null,site=null,media=[],news=[],staff=[];async function api(url,opt={}){const r=await fetch(url,{headers:{'Content-Type':'application/json'},...opt});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.message||'Có lỗi xảy ra');return j}function can(p){return session?.role==='superadmin'||(session?.permissions||[]).includes(p)}function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}async function boot(){try{const s=await api('/api/admin-session');session=s.user;login.style.display='none';app.style.display='block';document.querySelector('#who').textContent=(session.name||session.username)+' · '+session.role;document.querySelectorAll('[data-perm]').forEach(b=>{if(!can(b.dataset.perm))b.classList.add('hide')});show('dashboard')}catch{login.style.display='grid';app.style.display='none'}}document.querySelector('#loginForm').onsubmit=async e=>{e.preventDefault();loginMsg.textContent='';try{await api('/api/admin-login',{method:'POST',body:JSON.stringify({username:username.value,password:password.value})});boot()}catch(err){loginMsg.textContent=err.message}};document.querySelector('#logout').onclick=async()=>{await api('/api/admin-logout',{method:'POST'}).catch(()=>{});location.reload()};document.querySelectorAll('.navbtn').forEach(b=>b.onclick=()=>{document.querySelectorAll('.navbtn').forEach(x=>x.classList.remove('active'));b.classList.add('active');show(b.dataset.tab)});async function loadAll(){site=await fetch('/data/site-content.json?x='+Date.now(),{cache:'no-store'}).then(r=>r.json());media=(await api('/api/admin-media')).items||[];if(can('news'))news=(await api('/api/admin-news')).items||[];if(session.role==='superadmin'||can('staff'))staff=(await api('/api/admin-users')).items||[]}async function show(tab){content.innerHTML='<div class="panel">Đang tải...</div>';try{if(tab==='dashboard')return dashboard();if(tab==='appearance')return appearance();if(tab==='media')return mediaTab();if(tab==='news')return newsTab();if(tab==='staff')return staffTab()}catch(e){content.innerHTML='<div class="panel msg">'+esc(e.message)+'</div>'}}async function dashboard(){await loadAll();content.innerHTML=`<div class="head"><div><h1>Tổng quan quản trị</h1><p>Quản lý toàn bộ nội dung website tại một nơi.</p></div></div><div class="stats"><div class="panel stat"><b>${Object.keys(site.slots||{}).length}</b><span>Vị trí ảnh giao diện</span></div><div class="panel stat"><b>${media.length}</b><span>Ảnh trong album</span></div><div class="panel stat"><b>${news.length}</b><span>Bài viết tin tức</span></div><div class="panel stat"><b>${staff.length}</b><span>Tài khoản nhân viên</span></div></div><div class="notice">Mọi ảnh tải lên từ phần Giao diện hoặc Album đều được đưa vào Album ảnh để tái sử dụng. Các quyền nhân viên được kiểm tra ở cả giao diện và API.</div>`}async function appearance(){if(!can('appearance'))throw Error('Không có quyền');site=await fetch('/data/site-content.json?x='+Date.now(),{cache:'no-store'}).then(r=>r.json());media=(await api('/api/admin-media')).items||[];content.innerHTML=`<div class="head"><div><h1>Giao diện & tất cả ảnh</h1><p>Thay ảnh cho từng khu vực bằng file mới, URL hoặc chọn lại từ Album ảnh.</p></div></div><div class="notice" style="margin-bottom:18px">Ảnh bản đồ/infographic nên dùng file gốc độ phân giải cao. Hệ thống không ép nén ảnh nhỏ hơn 4 MB.</div><div id="slotgrid" class="grid"></div>`;const g=document.querySelector('#slotgrid');Object.entries(site.slots||{}).forEach(([k,v])=>g.appendChild(slotCard(k,v)))}function slotCard(k,v){const el=document.createElement('article');el.className='card';const options=media.map(m=>`<option value="${esc(m.src)}">${esc(m.title)}</option>`).join('');el.innerHTML=`<div class="preview"><img src="${esc(v.src)}"></div><div class="body"><h3>${esc(v.label)}</h3><div class="path">${esc(v.src)}</div><label class="file">Chọn file mới<input type="file" accept="image/png,image/jpeg,image/webp" hidden></label><select class="control albumsel"><option value="">— Chọn từ Album ảnh —</option>${options}</select><input class="control url" placeholder="Hoặc dán URL ảnh"><button class="btn gold wide save">Lưu vào giao diện</button><div class="status"></div></div>`;const file=el.querySelector('input[type=file]'),img=el.querySelector('img'),status=el.querySelector('.status');let chosen=null;el.querySelector('.file').onclick=()=>file.click();file.onchange=()=>{chosen=file.files[0]||null;if(chosen){img.src=URL.createObjectURL(chosen);status.textContent='Đã chọn '+chosen.name}};el.querySelector('.save').onclick=async()=>{const url=el.querySelector('.url').value.trim(),mediaSrc=el.querySelector('.albumsel').value;if(!chosen&&!url&&!mediaSrc)return status.textContent='Hãy chọn ảnh.';el.classList.add('spinner');status.textContent='Đang lưu...';try{const dataUrl=chosen?await prepareImage(chosen):null;const out=await api('/api/admin-save',{method:'POST',body:JSON.stringify({slot:k,dataUrl,url,mediaSrc})});img.src=out.src+'?x='+Date.now();el.querySelector('.path').textContent=out.src;status.textContent='Đã lưu. Vercel sẽ tự triển khai.';chosen=null;file.value=''}catch(e){status.textContent=e.message}finally{el.classList.remove('spinner')}};return el}async function mediaTab(){if(!can('media')&&!can('appearance'))throw Error('Không có quyền');media=(await api('/api/admin-media')).items||[];content.innerHTML=`<div class="head"><div><h1>Album ảnh</h1><p>Kho ảnh dùng chung cho giao diện và bài viết tin tức.</p></div></div><div class="panel"><div class="formgrid"><label class="field">Tên ảnh<input id="mtitle" placeholder="Ví dụ: Hồ cảnh quan"></label><label class="field">Thẻ ảnh<input id="mtags" placeholder="tien-ich, canh-quan"></label><label class="field full">URL ảnh (nếu có)<input id="murl" placeholder="https://..."></label><label class="file full">Hoặc chọn ảnh từ máy<input id="mfile" type="file" accept="image/png,image/jpeg,image/webp" hidden></label></div><button id="madd" class="btn gold">Thêm vào Album</button><span id="mstatus" class="status"></span></div><div id="albumgrid" class="album"></div>`;document.querySelector('.file').onclick=()=>mfile.click();madd.onclick=async()=>{if(!mfile.files[0]&&!murl.value.trim())return mstatus.textContent='Chọn file hoặc URL.';madd.disabled=true;mstatus.textContent='Đang tải...';try{const dataUrl=mfile.files[0]?await prepareImage(mfile.files[0]):null;await api('/api/admin-media',{method:'POST',body:JSON.stringify({dataUrl,url:murl.value.trim(),title:mtitle.value.trim(),tags:mtags.value.trim()})});mstatus.textContent='Đã thêm vào album.';mediaTab()}catch(e){mstatus.textContent=e.message}finally{madd.disabled=false}};renderAlbum()}function renderAlbum(){const g=document.querySelector('#albumgrid');g.innerHTML=media.map(m=>`<article class="media"><img src="${esc(m.src)}"><div class="meta"><b>${esc(m.title)}</b><small>${esc(m.src)}</small><button class="btn danger wide" onclick="removeMedia('${m.id}')">Xóa khỏi album</button></div></article>`).join('')}async function removeMedia(id){if(!confirm('Xóa ảnh này khỏi Album? Ảnh đang dùng trên giao diện sẽ không bị đổi.'))return;await api('/api/admin-media',{method:'DELETE',body:JSON.stringify({id})});mediaTab()}async function newsTab(){if(!can('news'))throw Error('Không có quyền');news=(await api('/api/admin-news')).items||[];media=(await api('/api/admin-media')).items||[];content.innerHTML=`<div class="head"><div><h1>Bài viết tin tức</h1><p>Viết, sửa, lưu nháp và xuất bản tin tức trực tiếp lên website.</p></div></div><div class="panel"><input id="nid" type="hidden"><div class="formgrid"><label class="field full">Tiêu đề<input id="ntitle"></label><label class="field">Ngày đăng<input id="ndate" type="date"></label><label class="field">Trạng thái<select id="nstatus"><option value="published">Xuất bản</option><option value="draft">Bản nháp</option></select></label><label class="field full">Ảnh đại diện<select id="ncover"><option value="">— Chọn ảnh trong Album —</option>${media.map(m=>`<option value="${esc(m.src)}">${esc(m.title)}</option>`).join('')}</select></label><label class="field full">Mô tả ngắn<textarea id="nexcerpt" rows="3"></textarea></label><label class="field full">Nội dung bài viết<textarea id="ncontent" rows="10"></textarea></label><label class="field full">Nguồn / ghi chú<input id="nsource"></label></div><div class="row"><button id="nsave" class="btn gold">Lưu bài viết</button><button class="btn light" onclick="clearNews()">Bài mới</button><span id="nmsg" class="status"></span></div></div><div id="newslist" class="list"></div>`;ndate.value=new Date().toISOString().slice(0,10);nsave.onclick=saveNews;renderNews()}function renderNews(){newslist.innerHTML=news.map(n=>`<div class="item">${n.cover?`<img src="${esc(n.cover)}">`:''}<div class="itemmain"><h3>${esc(n.title)}</h3><p>${esc(n.excerpt||'')}</p><span class="badge">${n.status==='draft'?'Bản nháp':'Đã xuất bản'} · ${esc(n.publishedAt||'')}</span></div><button class="btn light" onclick="editNews('${n.id}')">Sửa</button><button class="btn danger" onclick="deleteNews('${n.id}')">Xóa</button></div>`).join('')}function editNews(id){const n=news.find(x=>x.id===id);if(!n)return;nid.value=n.id;ntitle.value=n.title||'';ndate.value=n.publishedAt||'';nstatus.value=n.status||'published';ncover.value=n.cover||'';nexcerpt.value=n.excerpt||'';ncontent.value=n.content||'';nsource.value=n.source||'';scrollTo({top:0,behavior:'smooth'})}function clearNews(){nid.value='';ntitle.value='';nexcerpt.value='';ncontent.value='';nsource.value='';ncover.value='';nstatus.value='published';ndate.value=new Date().toISOString().slice(0,10)}async function saveNews(){if(!ntitle.value.trim())return nmsg.textContent='Nhập tiêu đề.';nmsg.textContent='Đang lưu...';try{await api('/api/admin-news',{method:'POST',body:JSON.stringify({id:nid.value||null,title:ntitle.value,excerpt:nexcerpt.value,content:ncontent.value,cover:ncover.value,status:nstatus.value,publishedAt:ndate.value,source:nsource.value})});nmsg.textContent='Đã lưu.';newsTab()}catch(e){nmsg.textContent=e.message}}async function deleteNews(id){if(!confirm('Xóa bài viết này?'))return;await api('/api/admin-news',{method:'DELETE',body:JSON.stringify({id})});newsTab()}async function staffTab(){if(session.role!=='superadmin'&&!can('staff'))throw Error('Không có quyền');staff=(await api('/api/admin-users')).items||[];content.innerHTML=`<div class="head"><div><h1>Nhân viên & phân quyền</h1><p>Tạo tài khoản riêng cho từng nhân viên và giới hạn đúng chức năng họ được phép sử dụng.</p></div></div><div class="panel"><div class="formgrid"><label class="field">Họ tên<input id="sname"></label><label class="field">Tên đăng nhập<input id="suser"></label><label class="field">Mật khẩu<input id="spass" type="password"></label><label class="field">Vai trò<select id="srole"><option value="editor">Biên tập viên</option><option value="media">Nhân viên hình ảnh</option><option value="news">Nhân viên tin tức</option><option value="admin">Quản trị nội dung</option></select></label><div class="full"><b style="font-size:12px">Quyền chi tiết</b><div class="checkrow"><label><input type="checkbox" value="appearance" class="perm"> Giao diện</label><label><input type="checkbox" value="media" class="perm" checked> Album ảnh</label><label><input type="checkbox" value="news" class="perm" checked> Tin tức</label><label><input type="checkbox" value="staff" class="perm"> Nhân viên</label></div></div></div><button id="sadd" class="btn gold">Tạo nhân viên</button><span id="smsg" class="status"></span></div><div id="stafflist" class="list"></div>`;srole.onchange=rolePreset;sadd.onclick=addStaff;renderStaff()}function rolePreset(){const map={editor:['media','news'],media:['media'],news:['news'],admin:['appearance','media','news']},p=map[srole.value]||[];document.querySelectorAll('.perm').forEach(x=>x.checked=p.includes(x.value))}function renderStaff(){stafflist.innerHTML=staff.map(s=>`<div class="item"><div class="itemmain"><h3>${esc(s.name)}</h3><p>@${esc(s.username)} · ${esc(s.role)} · ${(s.permissions||[]).join(', ')||'Không có quyền'}</p><span class="badge">${s.active===false?'Đã khóa':'Đang hoạt động'}</span></div><button class="btn ${s.active===false?'light':'danger'}" onclick="toggleStaff('${s.id}',${s.active===false})">${s.active===false?'Mở khóa':'Khóa'}</button><button class="btn danger" onclick="deleteStaff('${s.id}')">Xóa</button></div>`).join('')||'<div class="panel">Chưa có tài khoản nhân viên. Tài khoản chủ Vercel hiện tại là Super Admin.</div>'}async function addStaff(){const permissions=[...document.querySelectorAll('.perm:checked')].map(x=>x.value);if(!sname.value||!suser.value||!spass.value)return smsg.textContent='Điền đủ họ tên, tài khoản, mật khẩu.';smsg.textContent='Đang tạo...';try{await api('/api/admin-users',{method:'POST',body:JSON.stringify({name:sname.value,username:suser.value,password:spass.value,role:srole.value,permissions})});staffTab()}catch(e){smsg.textContent=e.message}}async function toggleStaff(id,active){await api('/api/admin-users',{method:'PATCH',body:JSON.stringify({id,active})});staffTab()}async function deleteStaff(id){if(!confirm('Xóa tài khoản nhân viên này?'))return;await api('/api/admin-users',{method:'DELETE',body:JSON.stringify({id})});staffTab()}async function prepareImage(file){if(file.size<=4000000)return read(file);const src=await read(file),im=await new Promise((ok,no)=>{const i=new Image;i.onload=()=>ok(i);i.onerror=no;i.src=src});const max=3200,scale=Math.min(1,max/Math.max(im.width,im.height)),w=Math.round(im.width*scale),h=Math.round(im.height*scale),c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);let q=.95,out=c.toDataURL('image/webp',q);while(out.length>5200000&&q>.8){q-=.03;out=c.toDataURL('image/webp',q)}return out}function read(f){return new Promise((ok,no)=>{const r=new FileReader;r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(f)})}boot();</script></body></html>
