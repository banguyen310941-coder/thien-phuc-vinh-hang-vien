<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bài viết | Thiên Phúc Vĩnh Hằng Viên</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head><body><header class="site-header"><div class="wrap nav"><a class="brand" href="index.html"><img src="https://nghiatrangthienphuc.com/wp-content/uploads/2026/01/Logo-Thien-Phuc-Vinh-Hang-Vien.png" alt="Thiên Phúc"></a><button class="menu-toggle">☰</button><nav class="main-nav"><a href="index.html">Trang chủ</a><a href="gioi-thieu.html">Giới thiệu</a><a href="san-pham.html">Sản phẩm</a><a href="phoi-canh.html">Phối cảnh</a><a href="tin-tuc.html">Tin tức</a><a href="lien-he.html">Liên hệ</a></nav><a class="nav-cta" href="lien-he.html">Đăng ký tham quan</a></div></header><main><section class="article-hero"><div class="wrap"><a class="back" href="tin-tuc.html">← Tin tức</a><h1 id="title">Đang tải bài viết...</h1><p id="date"></p></div></section><article id="article" class="wrap article"><p>Đang tải nội dung...</p></article></main><footer class="site-footer"><div class="wrap footer-grid"><div class="footer-brand"><img src="https://nghiatrangthienphuc.com/wp-content/uploads/2026/01/Logo-Thien-Phuc-Vinh-Hang-Vien.png" alt="Thiên Phúc"><p>Hoa viên nghĩa trang sinh thái tại Uông Bí – Yên Tử, Quảng Ninh.</p></div><div><strong>Khám phá</strong><a href="gioi-thieu.html">Giới thiệu</a><a href="san-pham.html">Sản phẩm</a></div><div><strong>Thông tin</strong><a href="tin-tuc.html">Tin tức</a><a href="lien-he.html">Liên hệ</a></div></div><div class="copyright">© 2026 Thiên Phúc Vĩnh Hằng Viên.</div></footer><script src="script.js"></script><script>const id=new URLSearchParams(location.search).get('id'),title=document.querySelector('#title'),date=document.querySelector('#date'),article=document.querySelector('#article');function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}fetch('/data/news.json?x='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(d=>{const n=(d.items||[]).find(x=>x.id===id&&x.status==='published');if(!n)throw Error();document.title=n.title+' | Thiên Phúc Vĩnh Hằng Viên';title.textContent=n.title;date.textContent=(n.publishedAt||'').split('-').reverse().join('.');const paras=String(n.content||'').split(/\n+/).filter(Boolean).map(p=>'<p>'+esc(p)+'</p>').join('');article.innerHTML=(n.cover?`<img class="article-cover" src="${esc(n.cover)}" alt="${esc(n.title)}">`:'')+(n.excerpt?`<p class="lead">${esc(n.excerpt)}</p>`:'')+paras+(n.source?`<div class="source-box"><b>Nguồn:</b> ${esc(n.source)}</div>`:'')}).catch(()=>{title.textContent='Không tìm thấy bài viết';article.innerHTML='<p>Bài viết không tồn tại hoặc chưa được xuất bản.</p>'});</script></body></html>
